<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Share of option butterflies violating convexity: mid vs executable prices</title>
<desc>At mid prices 16.4%, 9.3% and 5.0% of BTC butterflies and 13.5%, 9.3% and 6.1% of ETH butterflies violate convexity at materiality floors of 0, 1 and 2 ticks. At executable prices the share is zero at every floor on both.</desc>
