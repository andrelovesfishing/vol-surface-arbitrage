<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>One BTC call butterfly priced at mid and at executable prices</title>
<desc>Three BTC calls at strikes 104k, 105k and 106k. At mid prices the middle call is $20 above the straight line between its neighbours, which looks like arbitrage. Buying the outside calls at the ask and selling the middle at the bid, it is $60 below the line: no arbitrage.</desc>
<rect width="720" height="400" rx="8" fill="#fcfcfb"/>
<text x="60" y="34" font-size="16" font-weight="600" fill="#0b0b0b">The same butterfly, priced two ways</text>
<text x="60" y="56" font-size="12.5" fill="#52514e">The middle option must not sit above the dashed line between its neighbours</text>
